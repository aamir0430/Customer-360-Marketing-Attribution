version: 2

models:

  - name: fct_customer_rfm

    description: >
      Customer-level RFM metrics calculated from identified
      GA4 purchase transactions. Preserves all CRM customers,
      including customers without identified purchases.

    columns:

      - name: customer_id
        description: Unique CRM customer identifier.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customer_profile')
                field: customer_id

      - name: analysis_date
        description: >
          Historical RFM reference date, calculated as
          one day after the latest identified purchase date.
        tests:
          - not_null

      - name: first_purchase_date
        description: Customer's earliest identified purchase date.

      - name: last_purchase_date
        description: Customer's most recent identified purchase date.

      - name: recency_days
        description: >
          Number of days between the historical analysis date
          and the customer's last identified purchase date.

      - name: frequency
        description: Number of distinct identified transactions.
        tests:
          - not_null

      - name: monetary_value
        description: >
          Total identified purchase revenue in USD for the customer.
        tests:
          - not_null

      - name: rfm_eligibility_status
        description: >
          Indicates whether the customer has at least one
          identified purchase transaction.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PURCHASER
                  - NO_PURCHASE

  - name: fct_customer_rfm_scores

    description: >
        Customer-level RFM scoring model. Assigns recency,
        frequency and monetary scores from 1 to 5 to identified
        purchasing customers. Customers without purchases
        retain NULL RFM scores.

    columns:

        - name: customer_id
          description: Unique CRM customer identifier.
          tests:
            - not_null
            - unique
            - relationships:
                arguments:
                  to: ref('dim_customer_profile')
                  field: customer_id

        - name: recency_score
          description: Recency score from 1 to 5.

        - name: frequency_score
          description: Frequency score from 1 to 5.

        - name: monetary_score
          description: Monetary score from 1 to 5.

        - name: rfm_score
          description: Three-digit combined RFM score.

        - name: rfm_score_total
          description: Sum of the three individual RFM scores.

        - name: rfm_eligibility_status
          description: Customer RFM scoring eligibility.
          tests:
            - accepted_values:
                arguments:
                  values:
                    - PURCHASER
                    - NO_PURCHASE
                  
  - name: dim_customer_segments

    description: >
      Customer segmentation model based on recency, frequency
      and monetary scores. Classifies all CRM customers into
      actionable marketing segments, including customers
      without identified purchases.

    columns:

      - name: customer_id
        description: Unique CRM customer identifier.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customer_profile')
                field: customer_id

      - name: customer_segment
        description: RFM-based customer segment.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Champions
                  - Loyal Customers
                  - Potential Loyalists
                  - Recent Customers
                  - Promising Customers
                  - Customers Needing Attention
                  - Cannot Lose Them
                  - At Risk
                  - Hibernating
                  - Lost
                  - No Purchase

      - name: segment_description
        description: Business interpretation of the customer segment.
        tests:
          - not_null

      - name: recommended_marketing_action
        description: Recommended marketing strategy for the segment.
        tests:
          - not_null

  - name: fct_customer_clv

    description: >
      Historical customer lifetime value model calculating
      observed identified customer revenue, order frequency,
      average order value, customer lifespan and historical
      customer value segments. This is not predictive CLV.

    columns:

      - name: customer_id
        description: Unique CRM customer identifier.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customer_profile')
                field: customer_id

      - name: total_orders
        description: Number of distinct identified transactions.
        tests:
          - not_null

      - name: historical_clv
        description: Total historical identified revenue in USD.
        tests:
          - not_null

      - name: average_order_value
        description: Average historical revenue per identified transaction.
        tests:
          - not_null

      - name: historical_value_segment
        description: Relative historical customer value category.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - High Value
                  - Medium Value
                  - Low Value
                  - Very Low Value
                  - No Purchase

      - name: clv_eligibility_status
        description: Indicates whether the customer has identified purchases.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PURCHASER
                  - NO_PURCHASE

  - name: dim_customer_360_analytics
    description: >
      Unified Customer 360 Analytics model combining customer-level
      RFM metrics, RFM scoring, customer segmentation, historical
      customer lifetime value and historical customer value segments.
      Retains the complete CRM customer population, including
      customers without identified purchases. Historical CLV is
      descriptive and is not a predictive lifetime value forecast.

    columns:
      - name: customer_id
        description: Unique CRM customer identifier.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customer_profile')
                field: customer_id

      - name: customer_segment
        description: RFM-based customer segment.
        tests:
          - not_null

      - name: historical_clv
        description: Total historical identified customer revenue in USD.
        tests:
          - not_null

      - name: historical_value_segment
        description: Historical customer value category.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - High Value
                  - Medium Value
                  - Low Value
                  - Very Low Value
                  - No Purchase

      - name: rfm_eligibility_status
        description: Indicates whether the customer has identified purchases.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PURCHASER
                  - NO_PURCHASE

      - name: clv_eligibility_status
        description: Indicates whether the customer has identified purchases.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PURCHASER
                  - NO_PURCHASE
          
  - name: fct_marketing_touchpoints
    description: >
      Session-level marketing touchpoints used for customer journey
      reconstruction and marketing attribution.

    columns:

      - name: session_key
        description: Unique session identifier.
        data_tests:
          - not_null
          - unique

      - name: user_pseudo_id
        description: GA4 anonymous user identifier.
        data_tests:
          - not_null

      - name: journey_id
        description: Unified CRM or GA4 journey identifier.
        data_tests:
          - not_null

      - name: identity_type
        description: Customer identity classification.
        data_tests:
          - not_null

      - name: touchpoint_source_status
        description: Availability of observed session source.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - AVAILABLE
                  - UNKNOWN

      - name: has_purchase
        description: Whether the session contains a purchase event.
        data_tests:
          - not_null

  - name: fct_conversion_journeys
    description: >
      Conversion-level marketing journey model linking eligible
      session touchpoints to purchase transactions within a
      30-day attribution lookback window.

    columns:

      - name: transaction_id
        description: Purchase transaction identifier.
        data_tests:
          - not_null

      - name: journey_id
        description: Unified CRM or GA4 journey identifier.
        data_tests:
          - not_null

      - name: conversion_timestamp
        description: Purchase event timestamp in UTC.
        data_tests:
          - not_null

      - name: touchpoint_session_key
        description: Session associated with the marketing touchpoint.
        data_tests:
          - not_null

      - name: touchpoint_timestamp
        description: UTC timestamp of the marketing touchpoint.
        data_tests:
          - not_null

      - name: eligible_touchpoint_count
        description: Number of eligible touchpoints for the transaction.
        data_tests:
          - not_null

      - name: first_touch_rank
        description: Chronological first-touch ranking.
        data_tests:
          - not_null

      - name: last_touch_rank
        description: Reverse chronological last-touch ranking.
        data_tests:
          - not_null

  - name: fct_first_last_touch_attribution
    description: >
      First-touch and last-touch marketing attribution.
      Each conversion receives 100 percent attribution
      credit under each model.

    columns:

      - name: transaction_id
        data_tests:
          - not_null

      - name: journey_id
        data_tests:
          - not_null

      - name: attribution_model
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - FIRST_TOUCH
                  - LAST_TOUCH

      - name: attribution_credit
        data_tests:
          - not_null

      - name: attributed_revenue
        data_tests:
          - not_null

      - name: touchpoint_session_key
        data_tests:
          - not_null

  - name: fct_linear_attribution
    description: >
      Linear marketing attribution model distributing
      conversion credit equally across all eligible
      touchpoints within the 30-day lookback window.

    columns:

      - name: transaction_id
        description: Purchase transaction identifier.
        data_tests:
          - not_null

      - name: journey_id
        description: Unified customer journey identifier.
        data_tests:
          - not_null

      - name: attribution_model
        description: Attribution methodology.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - LINEAR

      - name: attribution_credit
        description: Equal fractional credit assigned to the touchpoint.
        data_tests:
          - not_null

      - name: attributed_revenue
        description: Revenue credited to the touchpoint.
        data_tests:
          - not_null

      - name: eligible_touchpoint_count
        description: Number of eligible touchpoints in the conversion journey.
        data_tests:
          - not_null

      - name: touchpoint_session_key
        description: Marketing touchpoint session identifier.
        data_tests:
          - not_null

  - name: fct_time_decay_attribution
    description: >
      Time-decay attribution model using an exponential
      decay function with a seven-day half-life.
      More recent marketing touchpoints receive greater
      attribution credit.

    columns:

      - name: transaction_id
        description: Purchase transaction identifier.
        data_tests:
          - not_null

      - name: journey_id
        description: Unified customer journey identifier.
        data_tests:
          - not_null

      - name: attribution_model
        description: Attribution methodology.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - TIME_DECAY

      - name: attribution_credit
        description: Normalized time-decay attribution credit.
        data_tests:
          - not_null

      - name: attributed_revenue
        description: Revenue attributed to the touchpoint.
        data_tests:
          - not_null

      - name: initial_decay_weight
        description: Initial exponential decay weight.
        data_tests:
          - not_null

      - name: total_decay_weight
        description: Sum of initial weights per transaction.
        data_tests:
          - not_null

      - name: decay_half_life_days
        description: Time-decay half-life in days.
        data_tests:
          - not_null

      - name: touchpoint_session_key
        description: Marketing touchpoint session identifier.
        data_tests:
          - not_null

  - name: fct_attribution_comparison
    description: >
      Consolidated marketing attribution model combining
      first-touch, last-touch, linear and time-decay
      attribution methods.

    columns:

      - name: transaction_id
        description: Purchase transaction identifier.
        data_tests:
          - not_null

      - name: journey_id
        description: Customer journey identifier.
        data_tests:
          - not_null

      - name: attribution_model
        description: Attribution methodology.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - FIRST_TOUCH
                  - LAST_TOUCH
                  - LINEAR
                  - TIME_DECAY

      - name: attribution_credit
        description: Fractional credit assigned to the touchpoint.
        data_tests:
          - not_null

      - name: attributed_revenue
        description: Revenue attributed to the touchpoint.
        data_tests:
          - not_null

      - name: touchpoint_session_key
        description: Marketing touchpoint session identifier.
        data_tests:
          - not_null

      - name: eligible_touchpoint_count
        description: Eligible touchpoints in the conversion journey.
        data_tests:
          - not_null